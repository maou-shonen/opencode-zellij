[tools]
bun = "latest"
act = "latest"
lefthook = "latest"
node = "latest"
zellij = "latest"

[hooks]
postinstall = [
  { task = "install" },
  "lefthook install"
]

[tasks.install]
description = "Install project dependencies"
run = "bun install"

[tasks.build]
description = "Build the plugin"
run = "bun run build"

[tasks.check]
description = "Run typecheck, lint, tests, and build"
run = [
  "bun run typecheck",
  "bun run lint",
  "bun run test",
  "bun run build",
]

[tasks.test-integration]
description = "Run opt-in real Zellij integration tests"
run = "bun run test:integration"

[tasks.test-e2e]
description = "Run the public E2E entrypoint"
run = """
if [ \"${GITHUB_ACTIONS:-}\" = \"true\" ]; then
  bun run test:e2e:ci-pane
else
  bun run test:e2e:act
fi
"""
