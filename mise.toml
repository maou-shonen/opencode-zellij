[tools]
bun = "latest"
act = "latest"
lefthook = "latest"
node = "latest"
zellij = "latest"

[hooks]
postinstall = "lefthook install"

[tasks.install]
description = "Install project dependencies"
run = "bun install"

[tasks.build]
description = "Build the plugin"
run = "bun run build"

[tasks.check]
description = "Run typecheck, lint, tests, and build"
run = [
  "bun run typecheck",
  "bun run lint",
  "bun run test",
  "bun run build",
]

[tasks.test-integration]
description = "Run opt-in real Zellij integration tests"
run = "bun run test:integration"

[tasks.test-e2e-run]
description = "Run the E2E run-environment suite"
run = "bun run test:e2e:run"

[tasks.test-e2e-tui]
description = "Run the E2E TUI suite"
run = "bun run test:e2e:tui"

[tasks.test-e2e]
description = "Run the default E2E suite"
run = "bun run test:e2e"

[tasks.test-e2e-act]
description = "Run the GitHub Actions E2E job with act"
run = "bun run test:e2e:act"
