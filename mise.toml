[tools]
bun = "latest"
node = "latest"
zellij = "latest"

[tasks.install]
description = "Install project dependencies"
run = "bun install"

[tasks.build]
description = "Build the plugin"
run = "bun run build"

[tasks.check]
description = "Run typecheck, lint, tests, and build"
run = [
  "bun run typecheck",
  "bun run lint",
  "bun run test",
  "bun run build",
]

[tasks.test-integration]
description = "Run opt-in real Zellij integration tests"
run = "bun run test:integration"
