[tools]
bun = "latest"
act = "latest"
lefthook = "latest"
node = "latest"
zellij = "latest"

[hooks]
postinstall = [
  { task = "install" },
  "lefthook install"
]

[tasks.install]
description = "Install project dependencies"
run = "bun install"

[tasks.build]
description = "Build the plugin"
run = "bun run scripts/generate-schema.ts && bunx --bun tsdown"

[tasks.check]
description = "Run typecheck, lint, tests, and build"
run = [
  "bunx --bun tsc --noEmit",
  "bunx --bun eslint .",
  "bun test src",
  "bun run scripts/generate-schema.ts && bunx --bun tsdown",
]

[tasks.test-integration]
description = "Run integration tests against the built plugin"
run = """
bun run scripts/generate-schema.ts && bunx --bun tsdown && \
  bun test tests/integration
"""

[tasks.test-e2e]
description = "Run the public E2E entrypoint"
run = """
if [ \"${GITHUB_ACTIONS:-}\" = \"true\" ]; then
  bun test tests/e2e/ci-pane.test.ts
else
  act -j e2e -P ubuntu-latest=ghcr.io/catthehacker/ubuntu:act-24.04
fi
"""
