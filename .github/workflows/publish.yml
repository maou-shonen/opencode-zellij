name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish, for example v0.0.2'
        required: true
        type: string

permissions:
  # Required for OIDC
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag
        run: |
          case "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" in
            v*) ;;
            *) echo "Release tag must start with v" >&2; exit 1 ;;
          esac

      - name: Cache Node dependencies
        uses: maou-shonen/node-cache-action@v1

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Set package version from git tag
        run: npm version from-git --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: mise run install

      - name: Run checks
        run: mise run check

      - name: Publish to npm
        run: npm publish --registry https://registry.npmjs.org
