name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish, for example v0.0.2'
        required: true
        type: string

permissions:
  # Required for OIDC
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Cache Node dependencies
        uses: maou-shonen/node-cache-action@v1

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Set package version from git tag
        uses: BellCubeDev/update-package-version-by-release-tag@v2
        with:
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Normalize package manifest formatting
        run: |
          node -e 'const fs = require("node:fs"); const path = "package.json"; const content = fs.readFileSync(path, "utf8"); if (!content.endsWith("\n")) fs.writeFileSync(path, content + "\n")'

      - name: Install dependencies
        run: mise run install

      - name: Run checks
        run: mise run check

      - name: Publish to npm
        run: npm publish --registry https://registry.npmjs.org

      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Re-install after the second `actions/checkout` so the auto-commit
      # step's lefthook pre-commit hook (which runs `bunx --bun tsc --noEmit`
      # + `bunx --bun eslint . --fix`) has `@types/bun` and `@types/node`
      # available. Without this, the post-publish sync fails with
      # `TS2688: Cannot find type definition file for 'bun'/'node'`.
      - name: Install dependencies on default branch checkout
        run: mise run install

      - name: Write package version back to default branch
        uses: BellCubeDev/update-package-version-by-release-tag@v2
        with:
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Normalize default branch package manifest formatting
        run: |
          node -e 'const fs = require("node:fs"); const path = "package.json"; const content = fs.readFileSync(path, "utf8"); if (!content.endsWith("\n")) fs.writeFileSync(path, content + "\n")'

      - name: Commit package version update
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: sync package version to ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          file_pattern: package.json
