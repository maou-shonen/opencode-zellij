name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish, for example v0.0.2'
        required: true
        type: string

permissions:
  # Required for OIDC
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag
        run: |
          case "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" in
            v*) ;;
            *) echo "Release tag must start with v" >&2; exit 1 ;;
          esac

      - name: Cache Node dependencies
        uses: maou-shonen/node-cache-action@v1

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Set package version from git tag
        run: npm version from-git --no-git-tag-version --allow-same-version

      - name: Set package repository metadata
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs'

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          pkg.repository = {
            type: 'git',
            url: `https://github.com/${process.env.GITHUB_REPOSITORY}`,
          }

          const orderedPkg = {}
          for (const key of ['name', 'type', 'version', 'description', 'repository']) {
            if (key in pkg) {
              orderedPkg[key] = pkg[key]
            }
          }
          for (const [key, value] of Object.entries(pkg)) {
            if (!(key in orderedPkg)) {
              orderedPkg[key] = value
            }
          }

          writeFileSync('package.json', `${JSON.stringify(orderedPkg, null, 2)}\n`)
          EOF

      - name: Install dependencies
        run: mise run install

      - name: Run checks
        run: mise run check

      - name: Publish to npm
        run: npm publish --provenance --registry https://registry.npmjs.org
