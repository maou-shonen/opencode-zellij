name: Publish Preview Package

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-preview:
    name: Publish preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Node dependencies
        uses: maou-shonen/node-cache-action@ebf9e2ab607e1571fa03224186111c215a00b009 # v1

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Install dependencies
        run: mise run install

      - name: Build package
        run: mise run build

      - name: Publish preview package
        run: mise run publish-preview
